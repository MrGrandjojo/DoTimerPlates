# Builds the installable zip and publishes a GitHub release when a version
# tag is pushed (for example: git tag v1.3 && git push origin v1.3).
# The zip contains a DoTimerPlates/ folder, ready to drop into Interface\AddOns.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the addon zip
        run: |
          mkdir DoTimerPlates
          cp -r DoTimerPlates.toc DoTimerPlates.lua LICENSE media DoTimerPlates/
          zip -r "DoTimerPlates-${GITHUB_REF_NAME}.zip" DoTimerPlates

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "DoTimerPlates-${GITHUB_REF_NAME}.zip" \
            --title "DoTimer Plates ${GITHUB_REF_NAME}" \
            --notes "See CHANGELOG.md for the changes. Install: extract the zip into Interface\\AddOns."
